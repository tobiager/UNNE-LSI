<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap');

  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(0, 0, 0, 0.72);
    backdrop-filter: saturate(130%) blur(20px);
    -webkit-backdrop-filter: saturate(130%) blur(20px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }

  .nav-wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 24px;
  }

  .nav-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 68px;
    gap: 16px;
  }

  .brand {
    font-family: "Inter", -apple-system, system-ui, sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: #ffffff;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: -0.3px;
    font-feature-settings: "cv11", "ss03";
    flex-shrink: 0;
  }

  .brand-icon {
    width: 26px;
    height: 26px;
    background: #0099ff;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .brand-icon svg {
    width: 14px;
    height: 14px;
    fill: #ffffff;
  }

  .brand-lsi {
    display: inline;
    background: none;
    color: #ffffff;
    -webkit-background-clip: unset;
    background-clip: unset;
    animation: none;
    font-weight: 600;
  }

  /* Center nav */
  header nav {
    display: flex;
    align-items: center;
    gap: 2px;
    flex: 1;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 2px;
    flex: 1;
  }

  .nav-links a {
    font-family: "Inter", -apple-system, system-ui, sans-serif;
    color: #a6a6a6;
    text-decoration: none;
    font-size: 14px;
    font-weight: 400;
    padding: 6px 12px;
    border-radius: 8px;
    transition: color 0.15s, background 0.15s;
    font-feature-settings: "cv06", "cv11", "ss03";
    letter-spacing: -0.15px;
    margin-left: 0;
    white-space: nowrap;
  }

  .nav-links a:hover {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.06);
    text-decoration: none;
  }

  .hamburger {
    display: none;
    background: none;
    border: none;
    color: #a6a6a6;
    cursor: pointer;
    padding: 6px;
    border-radius: 8px;
    transition: color 0.15s, background 0.15s;
  }

  .hamburger:hover {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.06);
  }

  .hamburger svg {
    width: 22px;
    height: 22px;
  }

  /* GitHub repo pill */
  .gh-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: rgba(0, 153, 255, 0.08);
    border: 1px solid rgba(0, 153, 255, 0.22);
    border-radius: 100px;
    padding: 7px 14px;
    font-family: "Inter", -apple-system, system-ui, sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: #ffffff;
    text-decoration: none;
    transition: background 0.2s ease, border-color 0.2s ease;
    flex-shrink: 0;
    letter-spacing: -0.15px;
    white-space: nowrap;
  }

  .gh-pill:hover {
    background: rgba(0, 153, 255, 0.15);
    border-color: rgba(0, 153, 255, 0.4);
    text-decoration: none;
  }

  .gh-pill .gh-logo {
    width: 15px;
    height: 15px;
    fill: #0099ff;
    flex-shrink: 0;
  }

  .gh-pill .gh-sep {
    color: rgba(255, 255, 255, 0.2);
    font-weight: 300;
  }

  .gh-pill .gh-stars {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: #FFD700;
    font-size: 12px;
  }

  .gh-pill .gh-stars svg {
    width: 11px;
    height: 11px;
    fill: #FFD700;
    flex-shrink: 0;
  }

  @media (max-width: 860px) {
    .nav-links {
      display: none;
      position: absolute;
      top: 68px;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: saturate(130%) blur(20px);
      -webkit-backdrop-filter: saturate(130%) blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      flex-direction: column;
      padding: 16px;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .nav-links.active {
      display: flex;
    }

    .nav-links a {
      width: 100%;
      text-align: center;
      padding: 12px;
      font-size: 15px;
    }

    .hamburger {
      display: flex;
      align-items: center;
      justify-content: center;
    }
  }

  @media (max-width: 640px) {
    .nav-bar {
      gap: 8px;
    }
  }

  @media (max-width: 480px) {

    .gh-pill .gh-sep,
    .gh-pill .gh-stars {
      display: none;
    }
  }
</style>

      UNNE-LSI

      <span class="gh-stars">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" />

  </div>
</header>

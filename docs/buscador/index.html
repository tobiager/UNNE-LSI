    rel="stylesheet">
  <!-- marked.js moved to end of body to avoid Tracking Prevention -->
  <style>
    :root {
      --bg: #000;
      --accent: #0099ff;
      --accent2: rgba(0, 153, 255, .12);
      --border: rgba(255, 255, 255, .05);
      --panel: rgba(255, 255, 255, .04);
      --text: #fff;
      --muted: #a0a0a0;
      --radius: 14px;
      --footer-h: 48px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      scrollbar-width: thin;
      scrollbar-color: #333 #000
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px
    }

    ::-webkit-scrollbar-track {
      background: #000
    }

    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 3px
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent)
    }

    body {
      background: #000;
      color: #fff;
      font: 15px/1.6 "Inter", -apple-system, system-ui, sans-serif;
      font-feature-settings: "cv11", "ss03";
      padding-bottom: var(--footer-h);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 50vh;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(0, 153, 255, 0.15), transparent 75%);
    }

    /* ── PAGE ── */
    .page-wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 80px 20px 40px;
      position: relative;
      z-index: 1;
    }

    /* ── HEADER ── */
    .page-header {
      text-align: center;
      margin-bottom: 36px;
    }

    .page-header h1 {
      font-size: clamp(26px, 4vw, 42px);
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1.05;
      margin-bottom: 8px;
    }

    .page-header p {
      font-size: 14px;
      color: var(--muted);
      max-width: 400px;
      margin: 0 auto;
    }

    /* ── SEARCH ── */
    .search-wrap {
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
    }

    #search {
      width: 100%;
      max-width: 480px;
      padding: 12px 20px;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 100px;
      background: rgba(255, 255, 255, .05);
      color: #fff;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    #search::placeholder {
      color: var(--muted)
    }

    #search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 153, 255, .15)
    }

    /* ── LIST ── */
    .results-container {
      background: rgba(255, 255, 255, .03);
      border: 1px solid rgba(255, 255, 255, .07);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(0, 153, 255, .07);
    }

    #results {
      width: 100%;
      border-collapse: collapse
    }

    #results tr {
      display: flex;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, .05);
      transition: background .15s;
    }

    #results tr:last-child {
      border-bottom: none;
    }

    #results tr:hover {
      background: rgba(255, 255, 255, .03);
    }

    #results td {
      padding: 13px 20px;
      font-size: 14px;
      color: var(--muted);
    }

    .materia-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: -.2px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
      transition: color .15s;
    }

    .materia-link:hover {
      color: #33aaff;
      text-decoration: underline
    }

    .no-results {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 14px
    }

    .mat-badges {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .mat-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      color: var(--muted);
      white-space: nowrap;
    }

    .mat-badge.has-content {
      background: rgba(0,153,255,.08);
      border-color: rgba(0,153,255,.2);
      color: var(--accent);
    }

    #results td:first-child {
      flex: 1;
    }

    #results td:last-child {
      flex: 0 0 auto;
    }

    /* ── DETAIL: two-column layout ── */
    #detail-view {
      display: none;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .5s ease, transform .5s ease;
    }

    #detail-view.visible {
      opacity: 1;
      transform: translateY(0)
    }

    .detail-topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 100px;
      border: 1px solid rgba(255, 255, 255, .12);
      background: rgba(255, 255, 255, .05);
      color: #fff;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .btn-back:hover {
      background: rgba(255, 255, 255, .1)
    }

    .detail-title {
      font-size: clamp(18px, 2.5vw, 28px);
      font-weight: 700;
      letter-spacing: -1px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── ACTION BUTTONS — jerarquía: primario sólido / secundario outline ── */
    .btn-github,
    .btn-dl-all {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: 100px;
      background: var(--accent);
      border: 1px solid var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
      white-space: nowrap;
    }

    .btn-github:hover,
    .btn-dl-all:hover {
      background: #1aabff;
      border-color: #1aabff;
      transform: translateY(-1px);
    }

    .btn-github:active,
    .btn-dl-all:active {
      transform: translateY(0);
    }

    .btn-github:focus-visible,
    .btn-dl-all:focus-visible {
      outline: 2px solid rgba(0, 153, 255, .55);
      outline-offset: 2px;
    }

    .btn-contribute {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: 100px;
      border: 1px solid rgba(0, 153, 255, .35);
      background: transparent;
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
      white-space: nowrap;
    }

    .btn-contribute:hover {
      background: rgba(0, 153, 255, .1);
      border-color: rgba(0, 153, 255, .55);
      transform: translateY(-1px);
    }

    .btn-contribute:active {
      transform: translateY(0);
    }

    .btn-icon {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    /* two columns */
    .explorer {
      display: grid;
      grid-template-columns: 25% 1fr;
      gap: 24px;
      align-items: start;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      position: sticky;
      top: 80px;
      background: rgba(5, 5, 5, 0.7);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, .4);
      overflow: hidden;
      max-height: calc(100vh - 120px);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 14px 16px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sidebar-tree {
      overflow-y: auto;
      overflow-x: hidden;
      flex: 1;
    }

    /* tree items */
    .tree-list {
      list-style: none;
      padding: 0;
      margin: 0
    }

    .tree-item {
      border-bottom: 1px solid rgba(255, 255, 255, .03)
    }

    .tree-item:last-child {
      border-bottom: none
    }

    .tree-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
      font-size: 14px;
      color: #a0a0a0;
      user-select: none;
      border-left: 2px solid transparent;
      text-decoration: none;
    }

    .tree-row:hover {
      background: rgba(0, 153, 255, .05);
      color: var(--accent);
      border-left: 2px solid var(--accent);
      text-decoration: none;
    }

    .tree-row.active {
      background: var(--accent2);
      color: var(--accent);
      border-left: 2px solid var(--accent);
    }

    .tree-icon {
      font-size: 14px;
      flex-shrink: 0;
      width: 18px;
      text-align: center
    }

    .tree-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .kw-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent2);
      border: 1px solid rgba(0, 153, 255, .25);
      margin-left: 8px;
      flex-shrink: 0;
    }

    .tree-row.match {
      background: rgba(0, 153, 255, .06);
      box-shadow: inset 0 0 0 1px rgba(0, 153, 255, .22);
    }

    .tree-chevron {
      font-size: 10px;
      color: var(--muted);
      transition: transform .2s;
      flex-shrink: 0
    }

    .tree-chevron.open {
      transform: rotate(90deg)
    }

    .tree-children {
      list-style: none;
      padding: 0;
      margin: 0;
      background: rgba(0, 0, 0, .15);
      display: none;
    }

    .tree-children.open {
      display: block
    }

    .tree-children .tree-row {
      padding-left: 32px;
    }

    .tree-children .tree-children .tree-row {
      padding-left: 48px;
    }

    /* ── MAIN AREA ── */
    .main-area {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* README panel */
    .readme-panel {
      background: rgba(255, 255, 255, .03);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      min-height: 70vh;
    }

    .readme-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 14px;
      padding: 60px 0;
    }

    .top-progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      background: var(--accent);
      z-index: 9999;
      animation: loading-bar 1.5s ease-in-out infinite;
      box-shadow: 0 0 10px var(--accent);
    }

    @keyframes loading-bar {
      0% {
        left: -30%;
        width: 30%;
      }

      50% {
        width: 50%;
      }

      100% {
        left: 100%;
        width: 30%;
      }
    }

    .error-msg {
      color: #ff6b6b;
      font-size: 13px;
      background: rgba(255, 100, 100, .06);
      border: 1px solid rgba(255, 100, 100, .2);
      border-radius: 8px;
      padding: 14px 18px;
    }

    .error-msg a {
      color: var(--accent)
    }

    /* Markdown styles */
    .md-body {
      color: #ddd;
      line-height: 1.75;
      font-size: 14.5px
    }

    .md-body h1,
    .md-body h2,
    .md-body h3,
    .md-body h4 {
      color: #fff;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 1.3em 0 .5em;
      border-bottom: 1px solid rgba(0, 153, 255, .15);
      padding-bottom: .3em
    }

    .md-body h1 {
      font-size: 1.55em
    }

    .md-body h2 {
      font-size: 1.25em
    }

    .md-body h3 {
      font-size: 1.05em
    }

    .md-body h1:first-child,
    .md-body h2:first-child {
      margin-top: 0
    }

    .md-body p {
      margin: .75em 0
    }

    .md-body a {
      color: var(--accent);
      text-decoration: none
    }

    .md-body a:hover {
      text-decoration: underline
    }

    .md-body ul,
    .md-body ol {
      padding-left: 1.5em;
      margin: .6em 0
    }

    .md-body li {
      margin: .25em 0
    }

    .md-body code {
      background: rgba(255, 255, 255, .08);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 12.5px;
      font-family: "SFMono-Regular", Consolas, monospace;
      color: #a8d8ff
    }

    .md-body pre {
      background: rgba(0, 0, 0, .5);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      margin: 1em 0
    }

    .md-body pre code {
      background: none;
      padding: 0;
      color: #e0e0e0
    }

    .md-body blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 16px;
      margin: 1em 0;
      color: var(--muted);
      font-style: italic
    }

    .md-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 1em 0;
      font-size: 13px
    }

    .md-body th {
      background: rgba(0, 153, 255, .1);
      color: #fff;
      padding: 8px 12px;
      text-align: left;
      border: 1px solid rgba(0, 153, 255, .2)
    }

    .md-body td {
      padding: 7px 12px;
      border: 1px solid rgba(255, 255, 255, .06);
      color: #ccc
    }

    .md-body img {
      max-width: 100%;
      border-radius: 8px;
      vertical-align: middle;
      display: inline-block;
    }

    .md-body hr {
      border: none;
      border-top: 1px solid rgba(255, 255, 255, .07);
      margin: 1.5em 0
    }

    /* ── ANIM ── */
    .reveal {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity .5s ease, transform .5s ease
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0)
    }

    /* ── SEO CONTENT SECTION ── */
    .seo-section {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .seo-section summary {
      padding: 12px 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel);
      transition: background .15s;
    }

    .seo-section summary:hover {
      background: rgba(255,255,255,.04);
    }

    .seo-section summary::-webkit-details-marker { display: none; }

    .seo-section summary::after {
      content: '▶';
      font-size: 9px;
      color: var(--muted);
      margin-left: auto;
      transition: transform .2s;
    }

    .seo-section[open] summary::after {
      transform: rotate(90deg);
    }

    .seo-body {
      padding: 20px 24px 24px;
    }

    .seo-category {
      margin-bottom: 20px;
    }

    .seo-category:last-child {
      margin-bottom: 0;
    }

    .seo-category h3 {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      margin: 0 0 10px;
      letter-spacing: -0.2px;
    }

    .seo-category h4 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      margin: 0 0 8px;
    }

    .seo-file-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .seo-file-list a {
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.06);
      transition: color .15s, background .15s, border-color .15s;
      display: inline-block;
      max-width: 320px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .seo-file-list a:hover {
      color: var(--accent);
      background: rgba(0,153,255,.06);
      border-color: rgba(0,153,255,.2);
    }

    @media(max-width:700px) {
      .explorer {
        grid-template-columns: 1fr
      }

      .sidebar {
        position: static;
        max-height: 260px
      }

      .page-wrap {
        padding: 52px 14px 32px
      }

      .readme-panel {
        padding: 18px 16px
      }

      .detail-topbar {
        flex-wrap: wrap
      }
    }

    @media (max-width: 600px) {
      /* ─ Page ─ */
      .page-wrap {
        padding: 52px 12px 20px;
      }

      /* ─ Header ─ */
      .page-header {
        margin-bottom: 20px;
      }

      /* ─ Search ─ */
      #search {
        max-width: 100%;
      }

      /* ─ List: compact rows (mín 44px de altura táctil) ─ */
      #results td {
        padding: 12px 10px;
      }

      #results td:first-child {
        width: 55%;
      }

      /* ─ Badges: ocultar texto, mostrar solo ícono + número ─ */
      .badge-label {
        display: none;
      }

      .mat-badge {
        padding: 2px 5px;
        gap: 1px;
      }

      .mat-badges {

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="../layout/layout.js?v=1.1.1"></script>
  <script src="../app.js?v=1.1.1"></script>
  <script>
    // Sin version string: el SW hace network-first para materias.json (siempre fresco online).
    // Para usuarios sin SW, GitHub Pages sirve con ETag/Last-Modified (revalida en cada visita).
    const DATA_URL = '../materias.json';
    const BASE_TITLE = 'LSI Tools';
    let MATERIAS = [];

    const KW_TO_LABEL = {
      final: 'Finales',
      parcial: 'Parciales',
      resumen: 'Resúmenes',
      guia: 'Guías',
      tp: 'TPs',
      examen: 'Exámenes'
    };

    const KW_TO_BADGE = {
      final: 'Final',
      parcial: 'Parcial',
      resumen: 'Resumen',
      guia: 'Guía',
      tp: 'TP',
      examen: 'Examen'
    };

    // Títulos y descripciones SEO por keyword — orientados a intent de búsqueda
    const KW_TITLE_SUFFIX = {
      final:   '— Finales Resueltos UNNE LSI',
      parcial: '— Parciales Resueltos UNNE LSI',
      resumen: '— Resúmenes y Apuntes UNNE LSI',
      guia:    '— Guías de TPs UNNE LSI',
      tp:      '— Trabajos Prácticos UNNE LSI',
      examen:  '— Exámenes Resueltos UNNE LSI'
    };

    const KW_DESC = {
      final:   n => `Finales resueltos de ${n} para la Licenciatura en Sistemas de Información (LSI) en la UNNE. Material académico colaborativo y actualizado.`,
      parcial: n => `Parciales resueltos de ${n} para LSI UNNE. Exámenes de años anteriores con soluciones y modelos de preguntas.`,
      resumen: n => `Resúmenes y apuntes de ${n} para LSI UNNE. Material de estudio colaborativo redactado por estudiantes que ya aprobaron.`,
      guia:    n => `Guías de Trabajos Prácticos de ${n} para LSI UNNE. Ejercicios resueltos paso a paso y metodologías para aprobar.`,
      tp:      n => `TPs resueltos de ${n} para LSI en la UNNE. Trabajos prácticos, ejercicios y ejemplos de código.`,
      examen:  n => `Exámenes resueltos de ${n} para LSI UNNE. Modelos de parciales y finales con soluciones detalladas.`
    };

    // Mapeo de abreviaturas y nombres alternativos → nombre canonical de la materia
    const ALIAS_MAP = {
      'bd1': 'bases-de-datos-1',
      'bd2': 'bases-de-datos-2',
      'bdd1': 'bases-de-datos-1',
      'bdd2': 'bases-de-datos-2',
      'aed1': 'algoritmo-y-estructura-de-datos-1',
      'aed2': 'algoritmo-y-estructura-de-datos-2',
      'algo1': 'algoritmo-y-estructura-de-datos-1',
      'algo2': 'algoritmo-y-estructura-de-datos-2',
      'poo': 'programacion-orientada-a-objetos',
      'is1': 'ingenieria-de-software-1',
      'is2': 'ingenieria-de-software-2',
      'isi': 'ingenieria-de-software-1',
      'isii': 'ingenieria-de-software-2',
      'so': 'sistemas-operativos',
      'pye': 'probabilidad-y-estadistica',
      'lymc': 'logica-y-matematica-computacional',
      'pyl': 'paradigmas-y-lenguajes',
      'arq': 'arquitectura-de-computadoras',
      'admin': 'administracion-y-gestion-de-organizaciones',
      'aygo': 'administracion-y-gestion-de-organizaciones',
      'cd1': 'comunicacion-de-datos-1',
      'eco': 'economia-aplicada',
      'syo': 'sistemas-y-organizaciones',
      'tc': 'teoria-de-la-computacion',
      'ingles': 'ingles-tecnico',
      'calcu': 'calculo',
      'tp1': 'taller-de-programacion-1',
      'tp2': 'taller-de-programacion-2',
      'alge': 'algebra'
    };

    let ACTIVE_KW = null;

    function normalizeText(s) {
      return (s || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function detectKwFromQuery(query) {
      const q = normalizeText(query);
      if (!q) return null;

      // Mantenerlo simple: solo 1 keyword activa (la primera que matchee)
      if (/\bfinal(es)?\b/.test(q)) return 'final';
      if (/\bparcial(es)?\b/.test(q)) return 'parcial';
      if (/\bresumen(es)?\b/.test(q)) return 'resumen';
      if (/\bguia(s)?\b/.test(q)) return 'guia';
      if (/\bexamen(es)?\b/.test(q)) return 'examen';
      // TP: tp, tp1, tp-2, tps, trabajo practico
      if (/\btp\b|\btp\d+\b|\btps\b/.test(q) || /\btrabajo\s*practico\b/.test(q)) return 'tp';

      return null;
    }

    function scoreMateria(materia, query) {
      const q = normalizeText(query);
      if (!q) return 0;

      const name = normalizeText(materia.nombre);
      const slug = normalizeText((materia.slug || '').replace(/-/g, ' '));

      // Si el query contiene el nombre completo o el slug, es un match fuerte.
      if (name && q.includes(name)) return 100;
      if (slug && q.includes(slug)) return 90;

      // Score por tokens (ignorando stop-words comunes)
      const stop = new Set(['de', 'del', 'la', 'el', 'y', 'en', 'a', 'para', 'por', 'los', 'las', 'un', 'una']);
      const tokens = q.split(' ').filter(t => t && !stop.has(t));
      if (!tokens.length) return 0;

      let score = 0;
      for (const t of tokens) {
        if (t.length < 2) continue;
        if (name.includes(t)) score += 6;
        else if (slug.includes(t)) score += 4;
      }

      return score;
    }

    // ── Helpers ──────────────────────────────────────────────────
    const ICONS = { pdf: '📄', md: '📝', txt: '📃', jpg: '🖼', jpeg: '🖼', png: '🖼', gif: '🖼', svg: '🖼', zip: '🗜', rar: '🗜', pptx: '📊', ppt: '📊', docx: '📝', doc: '📝', xlsx: '📊', xls: '📊', mp4: '🎬', mp3: '🎵', py: '🐍', js: '📜', java: '☕', c: '🔧', cpp: '🔧', cs: '🔷', json: '{}', xml: '📋', html: '🌐' };
    function getIcon(ext) { return ICONS[(ext || '').toLowerCase()] || '📎' }

    function setMeta(title, desc, canonical) {
      document.title = title;
      const dm = document.getElementById('page-desc');
      if (dm) dm.setAttribute('content', desc);
      const cl = document.getElementById('canonical-link');
      if (cl && canonical) cl.setAttribute('href', canonical);

      const setOg = (id, value) => {
        const el = document.getElementById(id);
        if (el && value) el.setAttribute('content', value);
      };
      setOg('og-title', title);
      setOg('og-desc', desc);
      setOg('og-url', canonical);
      setOg('tw-title', title);
      setOg('tw-desc', desc);
    }

    function injectCourseSchema(materia, activeKw) {
      let el = document.getElementById('ld-course');
      if (!el) {
        el = document.createElement('script');
        el.id = 'ld-course';
        el.type = 'application/ld+json';
        document.head.appendChild(el);
      }
      const kwLabel = activeKw && KW_TO_LABEL[activeKw] ? KW_TO_LABEL[activeKw] : null;
      const desc = kwLabel
        ? `${kwLabel} de ${materia.nombre} — Licenciatura en Sistemas de Información UNNE. Material académico colaborativo.`
        : `Apuntes, parciales resueltos y material de estudio de ${materia.nombre} para LSI en la UNNE.`;
      const hasParts = materia.seo && materia.seo.top_categorias && materia.seo.top_categorias.length > 0;
      const schema = {
        "@context": "https://schema.org",
        "@type": "Course",
        "name": materia.nombre,
        "description": desc,
        "url": materia.url_buscador,
        "inLanguage": "es-AR",
        "provider": {
          "@type": "EducationalOrganization",
          "name": "UNNE — Licenciatura en Sistemas de Información",
          "url": "https://tobiager.github.io/UNNE-LSI/"
        },
        "educationalLevel": "University",
        "teaches": materia.nombre,
        "isAccessibleForFree": true,
        "courseMode": "online",
        "hasCourseInstance": {
          "@type": "CourseInstance",
          "courseMode": "online",
          "inLanguage": "es-AR"
        }
      };
      if (hasParts) {
        schema.about = materia.seo.top_categorias.map(cat => ({
          "@type": "Thing",
          "name": cat + " de " + materia.nombre
        }));
      }
      el.textContent = JSON.stringify(schema);
    }

    function removeCourseSchema() {
      const el = document.getElementById('ld-course');
      if (el) el.remove();
    }

    // ── Limpieza de nombres de archivo para texto legible ─────────
    function cleanFileName(nombre, matNombre) {
      const ext = /\.[a-z0-9]{1,5}$/i;
      return (nombre || '')
        .replace(ext, '')
        .replace(/[-_]/g, ' ')
        .replace(/\(\d+\)/g, '')
        .replace(/\s{2,}/g, ' ')
        .replace(/^\s+|\s+$/g, '');
    }

    const CAT_H3 = {
      Final:   n => `Finales de ${n}`,
      Parcial: n => `Parciales de ${n}`,
      Resumen: n => `Resúmenes y Apuntes de ${n}`,
      TP:      n => `Trabajos Prácticos de ${n}`,
      Examen:  n => `Exámenes de ${n}`,
      Guía:    n => `Guías de ${n}`
    };

    const CAT_H4 = {
      Final:   'Finales — LSI UNNE',
      Parcial: 'Parciales Resueltos — LSI UNNE',
      Resumen: 'Material de Estudio — LSI UNNE',
      TP:      'Trabajos Prácticos — LSI UNNE',
      Examen:  'Exámenes Resueltos — LSI UNNE',
      Guía:    'Guías — LSI UNNE'
    };

    // ── Sección de archivos indexable por Google ──────────────────
    function renderSemanticContent(materia) {
      const section = document.getElementById('seo-section');
      const body = document.getElementById('seo-body');
      const label = document.getElementById('seo-section-label');
      if (!section || !body) return;

      // Recolectar archivos planos agrupados por categoría primaria
      const groups = {};
      let totalFiles = 0;

      function collectFiles(items) {
        (items || []).forEach(item => {
          if (item.tipo === 'archivo') {
            const cat = item.categoria || 'Material';
            if (!groups[cat]) groups[cat] = [];
            groups[cat].push(item);
            totalFiles++;
          } else if (item.tipo === 'carpeta' && item.hijos) {
            collectFiles(item.hijos);
          }
        });
      }
      collectFiles(materia.contenido);

      if (totalFiles === 0) {
        section.style.display = 'none';
        return;
      }

      // Orden de categorías por relevancia de búsqueda
      const CAT_ORDER = ['Parcial', 'Final', 'Resumen', 'TP', 'Examen', 'Guía'];
      const sortedCats = [...new Set([
        ...CAT_ORDER.filter(c => groups[c]),
        ...Object.keys(groups).filter(c => !CAT_ORDER.includes(c))
      ])];

      let html = '';
      for (const cat of sortedCats) {
        const files = groups[cat];
        const h3Text = (CAT_H3[cat] ? CAT_H3[cat](materia.nombre) : `${cat} de ${materia.nombre}`);
        const h4Text = CAT_H4[cat] || `${cat} — LSI UNNE`;
        html += `<div class="seo-category">
          <h3>${h3Text}</h3>
          <h4>${h4Text}</h4>
          <ul class="seo-file-list">`;
        for (const f of files) {
          const display = cleanFileName(f.nombre, materia.nombre);
          // Usar url_blob (página de GitHub) como href indexable
          const href = f.url_blob || f.url_raw || '#';
          html += `<li><a href="${href}" target="_blank" rel="noopener">${display}</a></li>`;
        }
        html += '</ul></div>';
      }

      body.innerHTML = html;
      if (label) label.textContent = `${totalFiles} archivos disponibles`;
      section.style.display = '';
    }

    function clearSemanticContent() {
      const section = document.getElementById('seo-section');
      const body = document.getElementById('seo-body');
      if (section) section.style.display = 'none';
      if (body) body.innerHTML = '';
    }

    // ── Fetch ─────────────────────────────────────────────────────
    async function loadMaterias() {
      const res = await fetch(DATA_URL);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      MATERIAS = await res.json();
    }

    // ── List view ─────────────────────────────────────────────────
    function renderList(filter = '') {
      const tbody = document.getElementById('results-body');
      const q = normalizeText(filter);

      let list = MATERIAS.slice();
      if (q) {
        list = list
          .map(m => ({ m, score: scoreMateria(m, q) }))
          .filter(x => x.score > 0)
          .sort((a, b) => b.score - a.score)
          .map(x => x.m);
      }

      if (!list.length) {
        tbody.innerHTML = '<tr><td><div class="no-results">No se encontraron materias 🔍</div></td></tr>';
        return;
      }
      const CAT_ICON = { Final: '📝', Parcial: '📋', Resumen: '📖', TP: '🔧', Examen: '📑', Guía: '📚' };
      tbody.innerHTML = list.map(m => {
        const cats = (m.seo && m.seo.categorias) ? m.seo.categorias : {};
        const topCats = (m.seo && m.seo.top_categorias) ? m.seo.top_categorias.slice(0, 3) : [];
        const badges = topCats.map(cat => {
          const count = cats[cat] || 0;
          const icon = CAT_ICON[cat] || '📄';
          const countHtml = count > 0 ? `<span class="badge-count"> · ${count}</span>` : '';
          return `<span class="mat-badge has-content">${icon}<span class="badge-label"> ${cat}</span>${countHtml}</span>`;
        }).join('');
        return `<tr>
          <td><button class="materia-link" onclick="openMateria('${m.slug}')">${m.nombre}</button></td>
          <td><div class="mat-badges">${badges}</div></td>
        </tr>`;
      }).join('');
    }

    function showList() {
      document.getElementById('detail-view').classList.remove('visible');
      setTimeout(() => {
        document.getElementById('detail-view').style.display = 'none';
        document.getElementById('list-view').style.display = '';
      }, 300);
      ACTIVE_KW = null;
      setMeta(`Materias — Apuntes LSI UNNE`,
        'Apuntes LSI UNNE de Sistemas: buscá parciales, finales, resúmenes y guías por materia.',
        'https://tobiager.github.io/UNNE-LSI/buscador/');
      removeCourseSchema();
      clearSemanticContent();
      history.pushState({}, '', window.location.pathname);
    }

    // ── Detail view ───────────────────────────────────────────────
    function showDetail(materia, opts = {}) {
      document.getElementById('list-view').style.display = 'none';
      const dv = document.getElementById('detail-view');
      dv.style.display = 'block';   // ← explícito, no '' (que hereda display:none del CSS)
      requestAnimationFrame(() => requestAnimationFrame(() => dv.classList.add('visible')));

      ACTIVE_KW = (opts.kw || null);
      if (ACTIVE_KW && !KW_TO_LABEL[ACTIVE_KW]) ACTIVE_KW = null;

      const kwLabel = ACTIVE_KW && KW_TO_LABEL[ACTIVE_KW] ? KW_TO_LABEL[ACTIVE_KW] : null;

      // Título orientado a búsqueda: "[KW] de [Materia] — UNNE LSI | Resueltos"
      const title = kwLabel
        ? `${kwLabel} de ${materia.nombre} ${KW_TITLE_SUFFIX[ACTIVE_KW] || '— UNNE LSI'}`
        : `${materia.nombre} UNNE LSI — Parciales, Finales y Apuntes Resueltos`;

      // Descripción rica en términos de búsqueda con intención de estudio
      const desc = ACTIVE_KW && KW_DESC[ACTIVE_KW]
        ? KW_DESC[ACTIVE_KW](materia.nombre)
        : `Parciales resueltos, finales, resúmenes y guías de TPs de ${materia.nombre}. Material colaborativo para LSI en la UNNE — Plan 2023 y 2009.`;

      const canonical = ACTIVE_KW
        ? `https://tobiager.github.io/UNNE-LSI/buscador/?materia=${materia.slug}&kw=${ACTIVE_KW}`
        : materia.url_buscador;

      setMeta(title, desc, canonical);
      injectCourseSchema(materia, ACTIVE_KW);
      const nextUrl = ACTIVE_KW
        ? `${window.location.pathname}?materia=${materia.slug}&kw=${ACTIVE_KW}`
        : `${window.location.pathname}?materia=${materia.slug}`;
      history.pushState({ slug: materia.slug, kw: ACTIVE_KW }, '', nextUrl);

      document.getElementById('detail-title').textContent = materia.nombre;
      document.getElementById('btn-dl-all').href = materia.url_downgit || '#';
      document.getElementById('btn-github').href = materia.url_github || '#';

      // Contribución rápida: genera Issue pre-llenado en GitHub
      const contributeBody = encodeURIComponent(
        `## Aporte para: ${materia.nombre}\n\n` +
        `**Tipo de material:** (parcial / final / resumen / TP / otro)\n\n` +
        `**Descripción:** \n\n` +
        `**Adjunto / link al archivo:** \n\n` +
        `---\n_Aporte enviado desde LSI Tools_`
      );
      const contributeTitle = encodeURIComponent(`[Aporte] ${materia.nombre}`);
      const contributeLabels = encodeURIComponent('nueva-materia-aporte');
      document.getElementById('btn-contribute').href =
        `https://github.com/tobiager/UNNE-LSI/issues/new?title=${contributeTitle}&body=${contributeBody}&labels=${contributeLabels}`;

      // Sidebar tree
      const tree = document.getElementById('sidebar-tree');
      tree.innerHTML = materia.contenido && materia.contenido.length
        ? renderTree(materia.contenido)
        : '<li><span style="color:var(--muted);font-size:13px;padding:14px">Sin archivos listados</span></li>';

      // README
      loadReadme(materia);

      // Sección semántica indexable por Google
      renderSemanticContent(materia);
    }

    function openMateria(slug, opts = {}) {
      const m = MATERIAS.find(x => x.slug === slug);
      if (m) showDetail(m, opts);
    }

    // ── README ────────────────────────────────────────────────────
    async function loadReadme(materia) {
      let pbar = document.getElementById('top-pbar');
      if (!pbar) {
        pbar = document.createElement('div');
        pbar.id = 'top-pbar';
        pbar.className = 'top-progress-bar';
        document.body.appendChild(pbar);
      }
      pbar.style.display = 'block';

      const loading = document.getElementById('readme-loading');
      const content = document.getElementById('readme-content');
      loading.style.display = 'flex';
      content.style.display = 'none';
      content.innerHTML = '';

      if (!materia.readme_raw) {
        pbar.style.display = 'none';
        loading.style.display = 'none';
        content.style.display = 'block';
        content.innerHTML = '<p style="color:var(--muted);font-size:13px">Esta materia no tiene README todavía. Explorá los archivos en el panel izquierdo.</p>';
        return;
      }

      try {
        const res = await fetch(materia.readme_raw);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const md = await res.text();
        pbar.style.display = 'none';
        loading.style.display = 'none';
        content.style.display = 'block';   // ← explícito
        content.innerHTML = marked.parse(md);
        // Fix relative image/link paths
        content.querySelectorAll('a[href],img[src]').forEach(el => {
          const attr = el.tagName === 'IMG' ? 'src' : 'href';
          const val = el.getAttribute(attr);
          if (val && !val.startsWith('http') && !val.startsWith('#') && !val.startsWith('mailto')) {
            const base = materia.readme_blob.replace('/README.md', '');
            el.setAttribute(attr, base + '/' + val);
            if (el.tagName === 'A') { el.target = '_blank'; el.rel = 'noopener'; }
          }
        });
      } catch (e) {
        pbar.style.display = 'none';
        loading.style.display = 'none';
        content.style.display = 'block';
        content.innerHTML = `<div class="error-msg">⚠ No se pudo cargar el README (${e.message}). <a href="${materia.readme_blob}" target="_blank" rel="noopener">Ver en GitHub →</a></div>`;
      }
    }

    // ── Sidebar tree renderer ─────────────────────────────────────
    function renderTree(items, depth = 0) {
      const kw = ACTIVE_KW;
      const list = (items || []).slice();

      if (kw) {
        const hasKw = (it) => Array.isArray(it.keywords) && it.keywords.includes(kw);
        list.sort((a, b) => {
          if (a.tipo !== b.tipo) return a.tipo === 'carpeta' ? -1 : 1;
          const am = hasKw(a) ? 1 : 0;
          const bm = hasKw(b) ? 1 : 0;
          if (am !== bm) return bm - am;
          return (a.nombre || '').localeCompare((b.nombre || ''), 'es', { sensitivity: 'base' });
        });
      }

      return list.map(item => {
        if (item.tipo === 'carpeta') {
          const id = 'sf-' + Math.random().toString(36).slice(2);
          const childrenHtml = item.hijos && item.hijos.length
            ? `<ul class="tree-children" id="${id}">${renderTree(item.hijos, depth + 1)}</ul>` : '';
          const match = kw && Array.isArray(item.keywords) && item.keywords.includes(kw);
          const badge = match && KW_TO_BADGE[kw] ? `<span class="kw-badge">${KW_TO_BADGE[kw]}</span>` : '';
          return `<li class="tree-item">
        <div class="tree-row ${match ? 'match' : ''}" onclick="toggleFolder('${id}',this)">
          <span class="tree-icon">📁</span>
          <span class="tree-label" title="${item.nombre}">${item.nombre}</span>${badge}
          ${item.hijos && item.hijos.length ? '<span class="tree-chevron">▶</span>' : ''}
        </div>${childrenHtml}</li>`;
        } else {
          const icon = getIcon(item.extension);
          const match = kw && Array.isArray(item.keywords) && item.keywords.includes(kw);
          const badge = match && KW_TO_BADGE[kw] ? `<span class="kw-badge">${KW_TO_BADGE[kw]}</span>` : '';
          // Archivos como <a> real: crawlable por Google, con comportamiento JS preservado
          const ext = (item.extension || '').toLowerCase();
          const viewExts = ['pdf', 'png', 'jpg', 'jpeg', 'gif', 'svg', 'mp4', 'webm'];
          const href = viewExts.includes(ext) ? (item.url_blob || item.url_raw) : (item.url_raw || item.url_blob);
          const safeRaw = (item.url_raw || '').replace(/'/g, '%27');
          const safeBlob = (item.url_blob || '').replace(/'/g, '%27');
          return `<li class="tree-item">
        <a href="${href}" target="_blank" rel="noopener"
           class="tree-row ${match ? 'match' : ''}"
           onclick="event.preventDefault(); openFile('${safeRaw}','${safeBlob}',this)"
           title="${item.nombre}">
          <span class="tree-icon">${icon}</span>
          <span class="tree-label">${item.nombre}</span>${badge}
        </a></li>`;
        }
      }).join('');
    }

    function toggleFolder(id, row) {
      const ul = document.getElementById(id);
      if (!ul) return;
      const open = ul.classList.toggle('open');
      const ch = row.querySelector('.tree-chevron');
      if (ch) ch.classList.toggle('open', open);
      const icon = row.querySelector('.tree-icon');
      if (icon) icon.textContent = open ? '📂' : '📁';
    }

    function openFile(rawUrl, blobUrl, row) {
      document.querySelectorAll('.tree-row.active').forEach(r => r.classList.remove('active'));
      row.classList.add('active');
      // For PDFs open in new tab; for others download
      const ext = rawUrl.split('.').pop().toLowerCase();
      const viewExts = ['pdf', 'png', 'jpg', 'jpeg', 'gif', 'svg', 'mp4', 'webm'];
      const target = viewExts.includes(ext) ? blobUrl : rawUrl;
      window.open(target, '_blank', 'noopener');
    }

    // ── Back ──────────────────────────────────────────────────────
    document.getElementById('btn-back').addEventListener('click', showList);

    const searchInput = document.getElementById('search');
    searchInput.addEventListener('input', e => renderList(e.target.value));
    searchInput.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const q = (e.target.value || '').trim();
      const kw = detectKwFromQuery(q);

      // Verificar si el query completo (sin kw) es un alias conocido
      const qNorm = normalizeText(q).split(' ').filter(t => !Object.values(KW_TO_LABEL).map(normalizeText).includes(t)).join(' ').trim();
      const aliasSlug = ALIAS_MAP[qNorm] || ALIAS_MAP[normalizeText(q)];
      if (aliasSlug) {
        const m = MATERIAS.find(x => x.slug === aliasSlug);
        if (m) { openMateria(m.slug, { kw }); return; }
      }

      const ranked = MATERIAS
        .map(m => ({ m, score: scoreMateria(m, q) }))
        .sort((a, b) => b.score - a.score);
      const best = ranked[0];
      if (best && best.score > 0) {
        openMateria(best.m.slug, { kw });
      }
    });

    window.addEventListener('popstate', e => {
      if (e.state && e.state.slug) openMateria(e.state.slug, { kw: e.state.kw || null });
      else showList();
    });

    // ── Init ──────────────────────────────────────────────────────
    (async () => {
      try {
        await loadMaterias();
        renderList();

        // Scroll reveal
        const obs = new IntersectionObserver(
          entries => entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target) } }),
          { threshold: .1, rootMargin: '0px 0px -30px 0px' }
        );
        document.querySelectorAll('.reveal').forEach(el => obs.observe(el));

        // Deep-link
        const params = new URLSearchParams(window.location.search);
        const slug = params.get('materia');
        let kw = (params.get('kw') || '').toLowerCase().trim() || null;
        if (kw && !KW_TO_LABEL[kw]) kw = null;
        if (slug) {
          const m = MATERIAS.find(x => x.slug === slug);
          if (m) { showDetail(m, { kw }); return; }
        }
        showList();
      } catch (err) {
        document.getElementById('results-body').innerHTML =
          `<tr><td><div class="no-results" style="color:#ff6b6b">Error al cargar materias: ${err.message}</div></td></tr>`;
        console.error('[Materias]', err);
      }
    })();
  </script>
  <script>
    const t = localStorage.getItem('theme') || 'theme-dark';
    document.body.classList.add(t);
  </script>
</body>

</html>

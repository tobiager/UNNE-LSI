  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>
    const DATA_URL = '../materias.json?v=' + Date.now();
    const BASE_TITLE = 'LSI Tools';
    let MATERIAS = [];

    const KW_TO_LABEL = {
      final: 'Finales',
      parcial: 'Parciales',
      resumen: 'Resúmenes',
      guia: 'Guías',
      tp: 'TPs',
      examen: 'Exámenes'
    };

    const KW_TO_BADGE = {
      final: 'Final',
      parcial: 'Parcial',
      resumen: 'Resumen',
      guia: 'Guía',
      tp: 'TP',
      examen: 'Examen'
    };

    let ACTIVE_KW = null;

    function normalizeText(s) {
      return (s || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function detectKwFromQuery(query) {
      const q = normalizeText(query);
      if (!q) return null;

      // Mantenerlo simple: solo 1 keyword activa (la primera que matchee)
      if (/\bfinal(es)?\b/.test(q)) return 'final';
      if (/\bparcial(es)?\b/.test(q)) return 'parcial';
      if (/\bresumen(es)?\b/.test(q)) return 'resumen';
      if (/\bguia(s)?\b/.test(q)) return 'guia';
      if (/\bexamen(es)?\b/.test(q)) return 'examen';
      // TP: tp, tp1, tp-2, tps, trabajo practico
      if (/\btp\b|\btp\d+\b|\btps\b/.test(q) || /\btrabajo\s*practico\b/.test(q)) return 'tp';

      return null;
    }

    function scoreMateria(materia, query) {
      const q = normalizeText(query);
      if (!q) return 0;

      const name = normalizeText(materia.nombre);
      const slug = normalizeText((materia.slug || '').replace(/-/g, ' '));

      // Si el query contiene el nombre completo o el slug, es un match fuerte.
      if (name && q.includes(name)) return 100;
      if (slug && q.includes(slug)) return 90;

      // Score por tokens (ignorando stop-words comunes)
      const stop = new Set(['de', 'del', 'la', 'el', 'y', 'en', 'a', 'para', 'por', 'los', 'las', 'un', 'una']);
      const tokens = q.split(' ').filter(t => t && !stop.has(t));
      if (!tokens.length) return 0;

      let score = 0;
      for (const t of tokens) {
        if (t.length < 2) continue;
        if (name.includes(t)) score += 6;
        else if (slug.includes(t)) score += 4;
      }

      return score;
    }

    // ── Helpers ──────────────────────────────────────────────────
    const ICONS = { pdf: '📄', md: '📝', txt: '📃', jpg: '🖼', jpeg: '🖼', png: '🖼', gif: '🖼', svg: '🖼', zip: '🗜', rar: '🗜', pptx: '📊', ppt: '📊', docx: '📝', doc: '📝', xlsx: '📊', xls: '📊', mp4: '🎬', mp3: '🎵', py: '🐍', js: '📜', java: '☕', c: '🔧', cpp: '🔧', cs: '🔷', json: '{}', xml: '📋', html: '🌐' };
    function getIcon(ext) { return ICONS[(ext || '').toLowerCase()] || '📎' }

    function setMeta(title, desc, canonical) {
      document.title = title;
      const dm = document.getElementById('page-desc');
      if (dm) dm.setAttribute('content', desc);
      const cl = document.getElementById('canonical-link');
      if (cl && canonical) cl.setAttribute('href', canonical);

      // Update OG/Twitter if tags exist
      const setOg = (id, value) => {
        const el = document.getElementById(id);
        if (el && value) el.setAttribute('content', value);
      };
      setOg('og-title', title);
      setOg('og-desc', desc);
      setOg('og-url', canonical);
      setOg('tw-title', title);
      setOg('tw-desc', desc);
    }

    // ── Fetch ─────────────────────────────────────────────────────
    async function loadMaterias() {
      const res = await fetch(DATA_URL);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      MATERIAS = await res.json();
    }

    // ── List view ─────────────────────────────────────────────────
    function renderList(filter = '') {
      const tbody = document.getElementById('results-body');
      const q = normalizeText(filter);

      let list = MATERIAS.slice();
      if (q) {
        list = list
          .map(m => ({ m, score: scoreMateria(m, q) }))
          .filter(x => x.score > 0)
          .sort((a, b) => b.score - a.score)
          .map(x => x.m);
      }

      if (!list.length) {
        tbody.innerHTML = '<tr><td><div class="no-results">No se encontraron materias 🔍</div></td></tr>';
        return;
      }
      tbody.innerHTML = list.map(m => `
    <tr><td><button class="materia-link" onclick="openMateria('${m.slug}')">${m.nombre}</button></td></tr>
  `).join('');
    }

    function showList() {
      document.getElementById('detail-view').classList.remove('visible');
      setTimeout(() => {
        document.getElementById('detail-view').style.display = 'none';
        document.getElementById('list-view').style.display = '';
      }, 300);
      ACTIVE_KW = null;
      setMeta(`Buscador de materias — Apuntes LSI UNNE`,
        'Apuntes LSI UNNE de Sistemas: buscá parciales, finales, resúmenes y guías por materia con un buscador rápido.',
        'https://tobiager.github.io/UNNE-LSI/buscador/');
      history.pushState({}, '', window.location.pathname);
    }

    // ── Detail view ───────────────────────────────────────────────
    function showDetail(materia, opts = {}) {
      document.getElementById('list-view').style.display = 'none';
      const dv = document.getElementById('detail-view');
      dv.style.display = 'block';   // ← explícito, no '' (que hereda display:none del CSS)
      requestAnimationFrame(() => requestAnimationFrame(() => dv.classList.add('visible')));

      ACTIVE_KW = (opts.kw || null);
      if (ACTIVE_KW && !KW_TO_LABEL[ACTIVE_KW]) ACTIVE_KW = null;

      const kwLabel = ACTIVE_KW && KW_TO_LABEL[ACTIVE_KW] ? KW_TO_LABEL[ACTIVE_KW] : null;
      const title = kwLabel
        ? `${kwLabel} de ${materia.nombre} — ${BASE_TITLE}`
        : `Apuntes de ${materia.nombre} — ${BASE_TITLE}`;
      const desc = kwLabel
        ? `Apuntes LSI UNNE de Sistemas: ${kwLabel.toLowerCase()}, guías y recursos de ${materia.nombre}.`
        : `Apuntes LSI UNNE de Sistemas: recursos, parciales y material de estudio de ${materia.nombre}.`;
      const canonical = ACTIVE_KW
        ? `https://tobiager.github.io/UNNE-LSI/buscador/?materia=${materia.slug}&kw=${ACTIVE_KW}`
        : materia.url_buscador;

      setMeta(title, desc, canonical);
      const nextUrl = ACTIVE_KW
        ? `${window.location.pathname}?materia=${materia.slug}&kw=${ACTIVE_KW}`
        : `${window.location.pathname}?materia=${materia.slug}`;
      history.pushState({ slug: materia.slug, kw: ACTIVE_KW }, '', nextUrl);

      document.getElementById('detail-title').textContent = materia.nombre;
      document.getElementById('btn-dl-all').href = materia.url_downgit || '#';
      document.getElementById('btn-github').href = materia.url_github || '#';

      // Sidebar tree
      const tree = document.getElementById('sidebar-tree');
      tree.innerHTML = materia.contenido && materia.contenido.length
        ? renderTree(materia.contenido)
        : '<li><span style="color:var(--muted);font-size:13px;padding:14px">Sin archivos listados</span></li>';

      // README
      loadReadme(materia);
    }

    function openMateria(slug, opts = {}) {
      const m = MATERIAS.find(x => x.slug === slug);
      if (m) showDetail(m, opts);
    }

    // ── README ────────────────────────────────────────────────────
    async function loadReadme(materia) {
      let pbar = document.getElementById('top-pbar');
      if (!pbar) {
        pbar = document.createElement('div');
        pbar.id = 'top-pbar';
        pbar.className = 'top-progress-bar';
        document.body.appendChild(pbar);
      }
      pbar.style.display = 'block';

      const loading = document.getElementById('readme-loading');
      const content = document.getElementById('readme-content');
      loading.style.display = 'flex';
      content.style.display = 'none';
      content.innerHTML = '';

      if (!materia.readme_raw) {
        pbar.style.display = 'none';
        loading.style.display = 'none';
        content.style.display = 'block';
        content.innerHTML = '<p style="color:var(--muted);font-size:13px">Esta materia no tiene README todavía. Explorá los archivos en el panel izquierdo.</p>';
        return;
      }

      try {
        const res = await fetch(materia.readme_raw);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const md = await res.text();
        pbar.style.display = 'none';
        loading.style.display = 'none';
        content.style.display = 'block';   // ← explícito
        content.innerHTML = marked.parse(md);
        // Fix relative image/link paths
        content.querySelectorAll('a[href],img[src]').forEach(el => {
          const attr = el.tagName === 'IMG' ? 'src' : 'href';
          const val = el.getAttribute(attr);
          if (val && !val.startsWith('http') && !val.startsWith('#') && !val.startsWith('mailto')) {
            const base = materia.readme_blob.replace('/README.md', '');
            el.setAttribute(attr, base + '/' + val);
            if (el.tagName === 'A') { el.target = '_blank'; el.rel = 'noopener'; }
          }
        });
      } catch (e) {
        pbar.style.display = 'none';
        loading.style.display = 'none';
        content.style.display = 'block';
        content.innerHTML = `<div class="error-msg">⚠ No se pudo cargar el README (${e.message}). <a href="${materia.readme_blob}" target="_blank" rel="noopener">Ver en GitHub →</a></div>`;
      }
    }

    // ── Sidebar tree renderer ─────────────────────────────────────
    function renderTree(items, depth = 0) {
      const kw = ACTIVE_KW;
      const list = (items || []).slice();

      if (kw) {
        const hasKw = (it) => Array.isArray(it.keywords) && it.keywords.includes(kw);
        list.sort((a, b) => {
          if (a.tipo !== b.tipo) return a.tipo === 'carpeta' ? -1 : 1;
          const am = hasKw(a) ? 1 : 0;
          const bm = hasKw(b) ? 1 : 0;
          if (am !== bm) return bm - am;
          return (a.nombre || '').localeCompare((b.nombre || ''), 'es', { sensitivity: 'base' });
        });
      }

      return list.map(item => {
        if (item.tipo === 'carpeta') {
          const id = 'sf-' + Math.random().toString(36).slice(2);
          const childrenHtml = item.hijos && item.hijos.length
            ? `<ul class="tree-children" id="${id}">${renderTree(item.hijos, depth + 1)}</ul>` : '';
          const match = kw && Array.isArray(item.keywords) && item.keywords.includes(kw);
          const badge = match && KW_TO_BADGE[kw] ? `<span class="kw-badge">${KW_TO_BADGE[kw]}</span>` : '';
          return `<li class="tree-item">
        <div class="tree-row ${match ? 'match' : ''}" onclick="toggleFolder('${id}',this)">
          <span class="tree-icon">📁</span>
          <span class="tree-label" title="${item.nombre}">${item.nombre}</span>${badge}
          ${item.hijos && item.hijos.length ? '<span class="tree-chevron">▶</span>' : ''}
        </div>${childrenHtml}</li>`;
        } else {
          const icon = getIcon(item.extension);
          const match = kw && Array.isArray(item.keywords) && item.keywords.includes(kw);
          const badge = match && KW_TO_BADGE[kw] ? `<span class="kw-badge">${KW_TO_BADGE[kw]}</span>` : '';
          return `<li class="tree-item">
        <div class="tree-row ${match ? 'match' : ''}" onclick="openFile('${item.url_raw}','${item.url_blob}',this)">
          <span class="tree-icon">${icon}</span>
          <span class="tree-label" title="${item.nombre}">${item.nombre}</span>${badge}
        </div></li>`;
        }
      }).join('');
    }

    function toggleFolder(id, row) {
      const ul = document.getElementById(id);
      if (!ul) return;
      const open = ul.classList.toggle('open');
      const ch = row.querySelector('.tree-chevron');
      if (ch) ch.classList.toggle('open', open);
      row.querySelector('.tree-icon').textContent = open ? '📂' : '📁';
    }

    function openFile(rawUrl, blobUrl, row) {
      document.querySelectorAll('.tree-row.active').forEach(r => r.classList.remove('active'));
      row.classList.add('active');
      // For PDFs open in new tab; for others download
      const ext = rawUrl.split('.').pop().toLowerCase();
      const viewExts = ['pdf', 'png', 'jpg', 'jpeg', 'gif', 'svg', 'mp4', 'webm'];
      const target = viewExts.includes(ext) ? blobUrl : rawUrl;
      window.open(target, '_blank', 'noopener');
    }

    // ── Back ──────────────────────────────────────────────────────
    document.getElementById('btn-back').addEventListener('click', showList);

    const searchInput = document.getElementById('search');
    searchInput.addEventListener('input', e => renderList(e.target.value));
    searchInput.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const q = e.target.value || '';
      const kw = detectKwFromQuery(q);
      const ranked = MATERIAS
        .map(m => ({ m, score: scoreMateria(m, q) }))
        .sort((a, b) => b.score - a.score);
      const best = ranked[0];
      if (best && best.score > 0) {
        openMateria(best.m.slug, { kw });
      }
    });

    window.addEventListener('popstate', e => {
      if (e.state && e.state.slug) openMateria(e.state.slug, { kw: e.state.kw || null });
      else showList();
    });

    // ── Init ──────────────────────────────────────────────────────
    (async () => {
      try {
        await loadMaterias();
        renderList();

        // Scroll reveal
        const obs = new IntersectionObserver(
          entries => entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target) } }),
          { threshold: .1, rootMargin: '0px 0px -30px 0px' }
        );
        document.querySelectorAll('.reveal').forEach(el => obs.observe(el));

        // Deep-link
        const params = new URLSearchParams(window.location.search);
        const slug = params.get('materia');
        let kw = (params.get('kw') || '').toLowerCase().trim() || null;
        if (kw && !KW_TO_LABEL[kw]) kw = null;
        if (slug) {
          const m = MATERIAS.find(x => x.slug === slug);
          if (m) { showDetail(m, { kw }); return; }
        }
        showList();
      } catch (err) {
        document.getElementById('results-body').innerHTML =
          `<tr><td><div class="no-results" style="color:#ff6b6b">Error al cargar materias: ${err.message}</div></td></tr>`;
        console.error('[Buscador]', err);
      }
    })();
  </script>
  <script>
    const t = localStorage.getItem('theme') || 'theme-dark';
    document.body.classList.add(t);
  </script>
</body>

</html>

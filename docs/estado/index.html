<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Estado de carrera</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --panel: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.07);
            --text: #ffffff;
            --muted: #a6a6a6;
            --accent: #0099ff;
            --footer-h: 48px;
        }

        body.theme-light {
            --bg: #f8f9fa;
            --panel: #ffffff;
            --border: rgba(0, 0, 0, 0.08);
            --text: #111111;
            --muted: #6b7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scrollbar-width: thin;
            scrollbar-color: #333333 #000000;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #000000;
        }

        ::-webkit-scrollbar-thumb {
            background: #333333;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #0099ff;
        }

        body {
            background: #000000;
            color: #ffffff;
            font: 15px/1.6 "Inter", -apple-system, system-ui, sans-serif;
            font-feature-settings: "cv11", "ss03";
            padding-bottom: var(--footer-h);
        }

        body.theme-light {
            background: var(--bg);
            color: var(--text);
        }

        body:not(.theme-light)::before {
            content: "";
            position: fixed;
            top: 68px;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(ellipse 80% 40% at 50% 0%, rgba(0, 153, 255, 0.05), transparent 60%);
        }

        /* ── WRAP ── */
        .page-wrap {
            max-width: 960px;
            margin: 0 auto;
            padding: 80px 24px 48px;
            position: relative;
            z-index: 1;
        }

        /* ── PAGE HEADER ── */
        .page-header {
            margin-bottom: 28px;
            position: relative;
        }

        .page-header>* {
            position: relative;
        }

        h1 {
            font-size: clamp(28px, 4vw, 44px);
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 1.05;
            color: #ffffff;
            margin-bottom: 16px;
        }

        body.theme-light h1 {
            color: var(--text);
        }

        .owner {
            color: #0099ff;
            font-style: normal;
        }

        /* ── BACK BUTTON ── */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #a6a6a6;
            font-size: 13px;
            padding: 7px 16px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: transparent;
            text-decoration: none;
            margin-bottom: 28px;
            transition: color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
            font-family: inherit;
            letter-spacing: -0.1px;
        }

        .back-link:hover {
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.18);
            text-decoration: none;
        }

        .back-link:active {
            transform: scale(0.95);
        }

        body.theme-light .back-link {
            color: var(--muted);
            border-color: rgba(0, 0, 0, 0.1);
        }

        body.theme-light .back-link:hover {
            color: var(--text);
            border-color: rgba(0, 0, 0, 0.2);
        }

        /* ── PANEL ── */
        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px 24px;
            margin-bottom: 16px;
            box-shadow: rgba(0, 153, 255, 0.07) 0px 0px 0px 1px;
        }

        body.theme-light .panel {
            box-shadow: none;
        }

        /* ── STAT LINES ── */
        .stat-plan {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.3px;
            margin-bottom: 6px;
        }

        body.theme-light .stat-plan {
            color: var(--text);
        }

        .stat-line {
            font-size: 13px;
            color: #a6a6a6;
            letter-spacing: -0.1px;
            margin-bottom: 16px;
        }

        .stat-line strong {
            color: #ffffff;
            font-weight: 600;
        }

        body.theme-light .stat-line {
            color: var(--muted);
        }

        body.theme-light .stat-line strong {
            color: var(--text);
        }

        /* ── PROGRESS BAR ── */
        .bar {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .meter {
            height: 8px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            flex: 1;
        }

        body.theme-light .meter {
            background: rgba(0, 0, 0, 0.06);
            border-color: rgba(0, 0, 0, 0.06);
        }

        .meter>span {
            display: block;
            height: 100%;
            width: 0%;
            border-radius: 999px;
            transition: width 0.7s cubic-bezier(0.22, 0.8, 0.26, 0.99);
        }

        .m-blue {
            background: linear-gradient(90deg, #0099ff, #0055cc);
        }

        .m-green {
            background: linear-gradient(90deg, #22c55e, #16a34a);
        }

        .pct {
            min-width: 3.5ch;
            text-align: right;
            color: #0099ff;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: -0.5px;
        }

        /* ── YEAR HEADERS ── */
        h3 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.8px;
            color: #ffffff;
            margin: 36px 0 14px;
            line-height: 1.1;
        }

        body.theme-light h3 {
            color: var(--text);
        }

        /* ── GRID ── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 12px;
            margin-top: 8px;
        }

        /* ── COLUMNS ── */
        .col {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .col-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #0099ff;
            margin-bottom: 4px;
        }

        /* ── CARDS ── */
        .card {
            border-radius: 12px;
            padding: 14px 16px;
            position: relative;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .card:hover {
            transform: scale(1.015);
        }

        .ttl {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.3px;
            line-height: 1.3;
            margin-bottom: 4px;
            padding-right: 80px;
        }

        body.theme-light .ttl {
            color: var(--text);
        }

        .sub {
            font-size: 12px;
            color: #a6a6a6;
            letter-spacing: -0.1px;
        }

        body.theme-light .sub {
            color: var(--muted);
        }

        .note {
            margin-top: 6px;
            color: #a6a6a6;
            font-size: 12px;
            white-space: pre-wrap;
            letter-spacing: -0.1px;
        }

        body.theme-light .note {
            color: var(--muted);
        }

        /* ── BADGE ── */
        .badge {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 3px 10px;
            border-radius: 100px;
            font-weight: 600;
            font-size: 11px;
            letter-spacing: 0.1px;
            white-space: nowrap;
        }

        /* ── STATUS VARIANTS ── */
        .no {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        .no .badge {
            background: rgba(255, 255, 255, 0.08);
            color: #a6a6a6;
        }

        .no:hover {
            box-shadow: rgba(255, 255, 255, 0.08) 0px 0px 0px 1px;
        }

        .cur {
            background: rgba(0, 153, 255, 0.05);
            border: 1px solid rgba(0, 153, 255, 0.2);
        }

        .cur .badge {
            background: rgba(0, 153, 255, 0.18);
            color: #60c4ff;
        }

        .cur:hover {
            box-shadow: rgba(0, 153, 255, 0.25) 0px 0px 0px 1px;
        }

        .reg {
            background: rgba(234, 179, 8, 0.04);
            border: 1px solid rgba(234, 179, 8, 0.22);
        }

        .reg .badge {
            background: rgba(234, 179, 8, 0.14);
            color: #fbbf24;
        }

        .reg:hover {
            box-shadow: rgba(234, 179, 8, 0.22) 0px 0px 0px 1px;
        }

        .ok {
            background: rgba(34, 197, 94, 0.04);
            border: 1px solid rgba(34, 197, 94, 0.22);
        }

        .ok .badge {
            background: rgba(34, 197, 94, 0.14);
            color: #4ade80;
        }

        .ok:hover {
            box-shadow: rgba(34, 197, 94, 0.22) 0px 0px 0px 1px;
        }

        /* light theme card overrides */
        body.theme-light .no {
            background: #f9fafb;
            border-color: #e5e7eb;
        }

        body.theme-light .cur {
            background: #eff6ff;
            border-color: #bfdbfe;
        }

        body.theme-light .reg {
            background: #fffbeb;
            border-color: #fde68a;
        }

        body.theme-light .ok {
            background: #f0fdf4;
            border-color: #bbf7d0;
        }

        body.theme-light .no .badge {
            background: #e5e7eb;
            color: #6b7280;
        }

        body.theme-light .cur .badge {
            background: #bfdbfe;
            color: #1d4ed8;
        }

        body.theme-light .reg .badge {
            background: #fde68a;
            color: #92400e;
        }

        body.theme-light .ok .badge {
            background: #bbf7d0;
            color: #166534;
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 600px) {
            .page-wrap {
                padding: 36px 16px 32px;
            }

            h1 {
                letter-spacing: -1.5px;
            }

            .panel {
                padding: 16px;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }

        /* ── SCROLL REVEAL ── */
        .reveal {
            opacity: 0;
            transform: translateY(16px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

<body>
  <div id="navbar"></div>
    <div class="page-wrap">
        <div class="page-header">
            <h1 class="reveal">Estado de carrera <span id="owner" class="owner"></span></h1>
        </div>
        <a href="../simulador/" class="back-link reveal">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
            </svg>
            Volver al simulador
        </a>
        <div id="head" class="panel reveal"></div>
        <div id="list" class="reveal"></div>
    </div>
    <script>
        const savedTheme = localStorage.getItem('theme') || 'theme-dark';
        document.body.classList.add(savedTheme);
        (async function () {
            function decodeHash() {
                try {
                    const h = location.hash.slice(1);
                    if (!h) return null;
                    return JSON.parse(decodeURIComponent(escape(atob(h))));
                } catch { return null; }
            }
            function encodeHash(obj) {
                return btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
            }
            let share = decodeHash();
            if (!share) {
                try {
                    const STORAGE_KEY = 'simulador-avance';
                    const NAME_KEY = 'simulador-nombre';
                    const PLAN_KEY = 'simulador-plan';
                    const plan = localStorage.getItem(PLAN_KEY);
                    const all = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                    if (plan && all[plan]) {
                        share = { plan, states: all[plan], name: localStorage.getItem(NAME_KEY) || '' };
                        location.hash = encodeHash(share);
                    }
                } catch { }
            }
            if (!share) { document.getElementById('head').textContent = 'No hay un estado guardado.'; return; }
            document.getElementById('owner').textContent = share.name ? `· ${share.name}` : '';
            const plans = await (await fetch('plans.json')).json();
            const plan = plans[share.plan];
            if (!plan) { document.getElementById('head').textContent = 'Plan no encontrado.'; return; }

            function getStatus(code) {
                const v = share.states?.[code];
                return typeof v === 'object' ? (v.s || 0) : (v || 0);
            }
            function getNote(code) {
                const v = share.states?.[code];
                return typeof v === 'object' ? (v.n || '') : '';
            }
            function escapeHtml(str) {
                return str.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
            }
            function parseGrade(str) {
                const m = str.match(/\d+(?:\.\d+)?/);
                return m ? Number(m[0]) : null;
            }

            const arr = plan.materias || [];
            const counts = { 0: 0, 1: 0, 2: 0, 3: 0 };
            arr.forEach(m => counts[getStatus(m.codigo)]++);
            const total = arr.length, pct = total ? Math.round(100 * counts[2] / total) : 0;

            const grades = arr
                .filter(m => getStatus(m.codigo) === 2)
                .map(m => parseGrade(getNote(m.codigo)))
                .filter(n => n !== null);
            const avg = grades.length ? (grades.reduce((a, b) => a + b, 0) / grades.length).toFixed(2) : null;

            const head = document.getElementById('head');
            const barClass = pct === 100 ? 'm-green' : 'm-blue';
            head.innerHTML = `
    <div class="stat-plan">Plan: ${plan.nombre}</div>
    <div class="stat-line">
      Aprobadas: <strong>${counts[2]}</strong>${avg ? ` &nbsp;·&nbsp; Promedio: <strong>${avg}</strong>` : ''}
      &nbsp;·&nbsp; En curso: <strong>${counts[3]}</strong>
      &nbsp;·&nbsp; Regulares: <strong>${counts[1]}</strong>
      &nbsp;·&nbsp; No cursadas: <strong>${counts[0]}</strong>
      &nbsp;·&nbsp; Total: <strong>${total}</strong>
    </div>
    <div class="bar">
      <div class="meter"><span class="${barClass}"></span></div>
      <div class="pct">${pct}%</div>
    </div>
  `;
            requestAnimationFrame(() => { head.querySelector('.meter span').style.width = pct + '%'; });

            const byYear = {};
            arr.forEach(m => {
                const s = getStatus(m.codigo);
                const note = getNote(m.codigo);
                const year = byYear[m.anio] ||= { 1: [], 2: [] };
                const cuat = m.cuatrimestre === 1 ? 1 : (m.cuatrimestre === 2 ? 2 : 2);
                year[cuat].push({ ...m, s, note });
            });

            function renderCards(list) {
                return list.map(m => {
                    const cls = m.s === 3 ? 'cur' : (m.s === 2 ? 'ok' : (m.s === 1 ? 'reg' : 'no'));
                    const label = m.s === 3 ? 'En curso' : (m.s === 2 ? 'Aprobada' : (m.s === 1 ? 'Regular' : 'No cursada'));
                    return `<div class="card ${cls}">
        <span class="badge">${label}</span>
        <div class="ttl">${m.nombre}</div>
        <div class="sub">${m.regimen} &nbsp;·&nbsp; ${m.carga_horaria}h</div>
        ${m.note ? `<div class="note">${escapeHtml(m.note)}</div>` : ''}
      </div>`;
                }).join('');
            }

            const list = document.getElementById('list');
            list.innerHTML = Object.keys(byYear).sort((a, b) => a - b).map(y => {
                const year = byYear[y];
                return `<h3>${y}° Año</h3>
    <div class="grid">
      <div class="col">
        <div class="col-title">1° Cuatrimestre</div>
        ${renderCards(year[1])}
      </div>
      <div class="col">
        <div class="col-title">2° Cuatrimestre</div>
        ${renderCards(year[2])}
      </div>
    </div>`;
            }).join('');
        })();

        // ── SCROLL REVEAL ──
        const revealObserver = new IntersectionObserver(
            entries => entries.forEach(e => {
                if (e.isIntersecting) { e.target.classList.add('visible'); revealObserver.unobserve(e.target); }
            }),
            { threshold: 0.1, rootMargin: '0px 0px -30px 0px' }
        );
        document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
    </script>
  <div id="footer"></div>
  <script src="../layout/layout.js"></script>
  <script src="../app.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
  <link rel="icon" href="https://raw.githubusercontent.com/tobiager/UNNE-LSI/main/assets/lsi.ico" type="image/x-icon">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Herramientas LSI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --panel: #0a0a0a;
      --border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --muted: #a6a6a6;
      --accent: #0099ff;
      --accent-glow: rgba(0, 153, 255, 0.15);
      --frosted: rgba(255, 255, 255, 0.1);
      --footer-h: 48px;
    }

    body.theme-dark {
      --bg: #000000;
      --panel: #0a0a0a;
      --border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --muted: #a6a6a6;
      --grad1: #000000;
      --grad2: #000000;
    }

    body.theme-light {
      --bg: #f8f9fa;
      --panel: #ffffff;
      --border: rgba(0, 0, 0, 0.1);
      --text: #111111;
      --muted: #6b7280;
      --grad1: #f0f4ff;
      --grad2: #e8f0fe;
    }

    /* ── CUSTOM SCROLLBAR ── */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #000000;
    }

    ::-webkit-scrollbar-thumb {
      background: #333333;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #0099ff;
    }

    * {
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: #333333 #000000;
    }

    body {
      margin: 0;
      background: #000000;
      color: #ffffff;
      font: 15px/1.6 "Inter", -apple-system, system-ui, sans-serif;
      font-feature-settings: "cv11";
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: var(--footer-h);
    }

    #content {
      flex: 1;
      border: none;
      width: 100%;
    }

    #alerts {
      position: fixed;
      left: 0;
      right: 0;
      bottom: var(--footer-h);
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 20;
    }

    .alert {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: saturate(130%) blur(12px);
      -webkit-backdrop-filter: saturate(130%) blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 100px;
      max-width: 640px;
      margin-bottom: 8px;
      text-align: center;
      font-size: 13px;
      font-family: "Inter", -apple-system, system-ui, sans-serif;
      box-shadow: rgba(0, 153, 255, 0.15) 0px 0px 0px 1px;
    }
  </style>
  <link rel="stylesheet" href="css/index.css">
</head>

<body>
  <div id="navbar"></div>
  <iframe id="content" src="home.html"></iframe>
  <div id="alerts"></div>
  <div id="footer"></div>
  <script src="layout/layout.js"></script>
  <script src="app.js"></script>
  <script>
    const savedTheme = localStorage.getItem('theme') || 'theme-dark';
    document.body.classList.add(savedTheme);

    // ── GitHub Stars: fetch once, update navbar pill ──────────────
    (async () => {
      try {
        const cached = sessionStorage.getItem('gh-stars');
        const count = cached || await fetch('https://api.github.com/repos/tobiager/UNNE-LSI')
          .then(r => r.ok ? r.json() : null)
          .then(d => d ? String(d.stargazers_count) : null);
        if (!count) return;
        sessionStorage.setItem('gh-stars', count);
        // Update navbar star count (navbar is in parent DOM)
        document.querySelectorAll('#gh-stars-count').forEach(el => el.textContent = count);
        // Also try to update inside the iframe if loaded
        const iframe = document.getElementById('content');
        if (iframe && iframe.contentDocument) {
          iframe.contentDocument.querySelectorAll('.gh-stars-count').forEach(el => el.textContent = count);
        }
        iframe && iframe.addEventListener('load', () => {
          try {
            iframe.contentDocument.querySelectorAll('.gh-stars-count').forEach(el => el.textContent = count);
          } catch (e) { }
        }, { once: false });
      } catch (e) { }
    })();
  </script>
</body>

</html>

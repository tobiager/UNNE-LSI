<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Herramientas LSI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-light:#f3f4f6; --bg-dark:#0b0f14;
    --panel-light:#ffffff; --panel-dark:#0f1625;
    --border-light:#d1d5db; --border-dark:#1f2a36;
    --text-light:#1f2937; --text-dark:#e6edf3;
    --muted-light:#6b7280; --muted-dark:#9fb0c2;
    --grad1-light:#ffffff; --grad1-dark:#10233a;
    --grad2-light:#e5e7eb; --grad2-dark:#1b2a43;
    --footer-h:56px;
  }
  body.theme-light{--bg:var(--bg-light);--panel:var(--panel-light);--border:var(--border-light);--text:var(--text-light);--muted:var(--muted-light);--grad1:var(--grad1-light);--grad2:var(--grad2-light)}
  body.theme-dark{--bg:var(--bg-dark);--panel:var(--panel-dark);--border:var(--border-dark);--text:var(--text-dark);--muted:var(--muted-dark);--grad1:var(--grad1-dark);--grad2:var(--grad2-dark)}
  *{box-sizing:border-box}
  body{
    margin:0;
    background:
      radial-gradient(900px 360px at -10% -10%,var(--grad1) 0,transparent 60%),
      radial-gradient(700px 480px at 110% -10%,var(--grad2) 0,transparent 50%),
      var(--bg);
    color:var(--text);
    font:16px/1.6 "Poppins",system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,"Noto Sans",sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    padding-bottom:var(--footer-h);
  }
  #content{flex:1;border:none;width:100%;}
  #alerts{position:fixed;left:0;right:0;bottom:var(--footer-h);padding:8px;display:flex;flex-direction:column;align-items:center;z-index:20;}
  .alert{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;max-width:640px;margin-bottom:8px;text-align:center;}
</style>
<link rel="stylesheet" href="css/index.css">
</head>
<body>
<div id="navbar"></div>
<iframe id="content" src="home.html"></iframe>
<div id="alerts"></div>
<div id="footer"></div>
<script src="layout/layout.js"></script>
<script src="app.js"></script>
<script>
const savedTheme=localStorage.getItem('theme')||'theme-dark';
document.body.classList.add(savedTheme);
</script>
</body>
</html>

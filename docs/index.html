  <style>
    :root {
      --bg: #000000;
      --panel: #0a0a0a;
      --border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --muted: #a6a6a6;
      --accent: #0099ff;
      --accent-glow: rgba(0, 153, 255, 0.15);
      --frosted: rgba(255, 255, 255, 0.1);
      --footer-h: calc(48px + env(safe-area-inset-bottom, 0px));
      /* nav-bar inner height (68px) + status-bar area on notch/island devices */
      --nav-h: calc(68px + env(safe-area-inset-top, 20px));
    }

    body.theme-dark {
      --bg: #000000;
      --panel: #0a0a0a;
      --border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --muted: #a6a6a6;
      --grad1: #000000;
      --grad2: #000000;
    }

    body.theme-light {
      --bg: #f8f9fa;
      --panel: #ffffff;
      --border: rgba(0, 0, 0, 0.1);
      --text: #111111;
      --muted: #6b7280;
      --grad1: #f0f4ff;
      --grad2: #e8f0fe;
    }

    *, *::before, *::after { box-sizing: border-box; }

    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      background: transparent !important;
    }

    html {
      overflow: hidden !important;
      height: 100dvh;
      width: 100%;
      margin: 0;
      padding: 0;
      overscroll-behavior: none;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }

    body {
      overflow: hidden !important;
      height: 100dvh;
      width: 100%;
      position: fixed;
      top: 0;
      left: 0;
      margin: 0;
      padding: 0;
      background: #000000;
      color: #ffffff;
      font: 15px/1.6 "Inter", -apple-system, system-ui, sans-serif;
      font-feature-settings: "cv11";
      display: flex;
      flex-direction: column;
      overscroll-behavior: none;
      padding-bottom: var(--footer-h);
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }

    #navbar {
      flex-shrink: 0;
      z-index: 100;
    }

    /* flex:1 fills all remaining space after navbar; the explicit height gives
       the iframe a concrete viewport value for Safari.
       overflow:hidden prevents iframe's internal scrollbar from leaking to parent. */
    #content {
      flex: 1;
      display: block !important;
      width: 100% !important;
      height: calc(100dvh - var(--footer-h));
      border: none !important;
      margin: 0 !important;
      padding: 0;
      min-height: 0;
      overflow: hidden;
      background: transparent;
    }

    #alerts {
      position: fixed;
      left: 0;
      right: 0;
      bottom: var(--footer-h);
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 20;
    }

    .alert {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: saturate(130%) blur(12px);
      -webkit-backdrop-filter: saturate(130%) blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 100px;
      max-width: 640px;
      margin-bottom: 8px;
      text-align: center;
      font-size: 13px;
      font-family: "Inter", -apple-system, system-ui, sans-serif;
      box-shadow: rgba(0, 153, 255, 0.15) 0px 0px 0px 1px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Ambient glow — fixed to viewport top, never scrolls.
       z-index 5: above iframe (auto), below alerts (20) and navbar (100). */
    #ambient-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60vh;
      background: radial-gradient(ellipse at 50% 0%, rgba(0, 153, 255, 0.15), transparent 75%);
      pointer-events: none;
      z-index: 5;
    }
  </style>
  <link rel="stylesheet" href="css/index.css?v=1.1.0">
</head>

<body>
  <div id="ambient-glow" aria-hidden="true"></div>
  <div id="navbar"></div>
  <h1 class="sr-only">Apuntes LSI UNNE — Sistemas</h1>
  <iframe id="content" src="home.html" allowtransparency="true"></iframe>
  <div id="alerts"></div>
  <div id="footer"></div>
  <script src="layout/layout.js?v=1.1.0"></script>
  <script src="app.js?v=1.1.0"></script>
  <script>
    const savedTheme = localStorage.getItem('theme') || 'theme-dark';
    document.body.classList.add(savedTheme);

    // ── Sync SEO meta with iframe (same-origin) ───────────────────
    (() => {
      const iframe = document.getElementById('content');
      if (!iframe) return;

      const setIfPresent = (id, value) => {
        const el = document.getElementById(id);
        if (el && value) el.setAttribute('content', value);
      };

      const update = () => {
        try {
          const doc = iframe.contentDocument;
          if (!doc) return;
          const title = (doc.title || '').trim();
          const desc = doc.querySelector('meta[name="description"]')?.getAttribute('content')?.trim();

          if (title) {
            document.title = title;
            setIfPresent('og-title', title);
            setIfPresent('tw-title', title);
          }
          if (desc) {
            const dm = document.getElementById('page-desc');
            if (dm) dm.setAttribute('content', desc);
            setIfPresent('og-desc', desc);
            setIfPresent('tw-desc', desc);
          }
        } catch (e) { }
      };

      iframe.addEventListener('load', update);
      update();
    })();
  </script>
</body>

</html>

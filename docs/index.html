  <style>
    :root {
      --bg: #000000;
      --panel: #0a0a0a;
      --border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --muted: #a6a6a6;
      --accent: #0099ff;
      --accent-glow: rgba(0, 153, 255, 0.15);
      --frosted: rgba(255, 255, 255, 0.1);
      --footer-h: calc(48px + env(safe-area-inset-bottom, 0px));
    }

    body.theme-dark {
      --bg: #000000;
      --panel: #0a0a0a;
      --border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --muted: #a6a6a6;
      --grad1: #000000;
      --grad2: #000000;
    }

    body.theme-light {
      --bg: #f8f9fa;
      --panel: #ffffff;
      --border: rgba(0, 0, 0, 0.1);
      --text: #111111;
      --muted: #6b7280;
      --grad1: #f0f4ff;
      --grad2: #e8f0fe;
    }

    /* ── CUSTOM SCROLLBAR ── */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #000000;
    }

    ::-webkit-scrollbar-thumb {
      background: #333333;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #0099ff;
    }

    * {
      box-sizing: border-box;
      scrollbar-width: thin;
      scrollbar-color: #333333 #000000;
    }

    body {
      margin: 0;
      background: #000000;
      color: #ffffff;
      font: 15px/1.6 "Inter", -apple-system, system-ui, sans-serif;
      font-feature-settings: "cv11";
      display: flex;
      flex-direction: column;
      /* Use a stable height so mobile-Safari chrome-collapse can't resize the
         body (and thus the iframe). overflow:hidden ensures the parent never
         scrolls — all page scrolling happens inside #content. */
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      padding-bottom: var(--footer-h);
    }

    /* Pre-reserva el espacio del navbar para que el iframe no cambie de
       altura cuando el navbar carga asíncronamente (evita el bug de render
       inicial en mobile Safari donde svh/dvh se calculan con el alto
       incorrecto del iframe). */
    #navbar {
      min-height: calc(68px + env(safe-area-inset-top, 0px));
    }

    #content {
      flex: 1;
      border: none;
      width: 100%;
      /* height: 0 + flex: 1 gives the iframe a *definite* computed height via
         the flex algorithm, which is what Safari needs to size the iframe
         viewport correctly (without this, Safari can report the iframe's
         clientHeight as the full document scroll-height instead of the
         visible viewport height). */
      height: 0;
      min-height: 0;
    }

    #alerts {
      position: fixed;
      left: 0;
      right: 0;
      bottom: var(--footer-h);
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 20;
    }

    .alert {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: saturate(130%) blur(12px);
      -webkit-backdrop-filter: saturate(130%) blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 100px;
      max-width: 640px;
      margin-bottom: 8px;
      text-align: center;
      font-size: 13px;
      font-family: "Inter", -apple-system, system-ui, sans-serif;
      box-shadow: rgba(0, 153, 255, 0.15) 0px 0px 0px 1px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
  <link rel="stylesheet" href="css/index.css">
</head>

<body>
  <div id="navbar"></div>
  <h1 class="sr-only">Apuntes LSI UNNE — Sistemas</h1>
  <iframe id="content" src="home.html"></iframe>
  <div id="alerts"></div>
  <div id="footer"></div>
  <script src="layout/layout.js"></script>
  <script src="app.js"></script>
  <script>
    const savedTheme = localStorage.getItem('theme') || 'theme-dark';
    document.body.classList.add(savedTheme);



    // ── Sync SEO meta with iframe (same-origin) ───────────────────
    (() => {
      const iframe = document.getElementById('content');
      if (!iframe) return;

      const setIfPresent = (id, value) => {
        const el = document.getElementById(id);
        if (el && value) el.setAttribute('content', value);
      };

      const update = () => {
        try {
          const doc = iframe.contentDocument;
          if (!doc) return;
          const title = (doc.title || '').trim();
          const desc = doc.querySelector('meta[name="description"]')?.getAttribute('content')?.trim();

          if (title) {
            document.title = title;
            setIfPresent('og-title', title);
            setIfPresent('tw-title', title);
          }
          if (desc) {
            const dm = document.getElementById('page-desc');
            if (dm) dm.setAttribute('content', desc);
            setIfPresent('og-desc', desc);
            setIfPresent('tw-desc', desc);
          }
        } catch (e) { }
      };

      iframe.addEventListener('load', update);
      update();
    })();
  </script>
</body>

</html>
